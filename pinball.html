<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>FATHOM &mdash; Descent of the Kraken's Eye</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;
    font-family:ui-monospace,Menlo,Consolas,monospace;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 40%,#0b1a2b 0%,#000 80%);}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;
    box-shadow:0 0 0 3px #17324f,0 0 0 6px #0b1a2b,0 0 40px #000;}
  #hint{position:fixed;left:0;right:0;bottom:2px;text-align:center;color:#2a5c8a;
    font-size:10px;letter-spacing:1px;pointer-events:none;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="448" height="768"></canvas></div>
<div id="hint">FATHOM &mdash; click to enable audio</div>
<script>
"use strict";
/* ==========================================================================
   FATHOM  —  Descent of the Kraken's Eye
   An original NES-era physics pinball table.  Everything (art, audio,
   physics) is generated in code.  No assets, no libraries, no build step.
   ========================================================================== */

/* ---------------------------------------------------------------- palette */
/* 22 colours, hand picked, used for absolutely everything on screen. */
const PAL = {
  ink:   '#000000', abyss: '#0b1a2b', navy:  '#17324f', blue:  '#2a5c8a',
  sky:   '#4fa3d1', cyan:  '#9be0f2', white: '#ffffff', deep:  '#0e3b2e',
  teal:  '#1c7a5e', green: '#3fd18b', lime:  '#d9f26b', amber: '#f2c14e',
  ochre: '#e8873a', red:   '#c8452f', maroon:'#7d1f2e', plum:  '#3a1030',
  purple:'#6b3fa0', lilac: '#b06fd6', gray:  '#8a8f98', silver:'#d7dde5',
  bark:  '#2b2118', sand:  '#5a4632'
};

/* ------------------------------------------------------------------ maths */
const TAU = Math.PI * 2;
const EPS = 1e-7;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const sign  = v => (v < 0 ? -1 : 1);
const dist2 = (ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; };
const dist  = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const rad   = d => d * Math.PI / 180;
const deg   = r => r * 180 / Math.PI;
/* shortest signed difference between two angles */
function angDiff(a, b) { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
/* is angle a inside the arc that sweeps from a0 forward (increasing) to a1 */
function angInArc(a, a0, a1) {
  let s = (a - a0) % TAU; if (s < 0) s += TAU;
  let e = (a1 - a0) % TAU; if (e < 0) e += TAU;
  if (e < EPS) e = TAU;
  return s <= e;
}

/* deterministic-ish rng so shake/dither can be seeded when testing */
let _seed = 0x2f6e2b1 >>> 0;
function rnd()  { _seed ^= _seed << 13; _seed ^= _seed >>> 17; _seed ^= _seed << 5; _seed >>>= 0; return _seed / 4294967296; }
function rndR(a, b) { return a + (b - a) * rnd(); }
function rndI(a, b) { return Math.floor(a + (b - a + 1) * rnd()); }
function seedRnd(s) { _seed = (s >>> 0) || 1; }

/* --------------------------------------------------------- 5x7 pixel font */
/* Column-major bitmaps, LSB = top row.  Drawn as chunky square pixels. */
const FONT = {};
(function () {
  const D = {
    ' ': '0000000000', '0': '3E5149453E', '1': '00427F4000',
    '2': '4261514946', '3': '2141454B31', '4': '1814127F10', '5': '2745454539',
    '6': '3C4A494930', '7': '0171090503', '8': '3649494936', '9': '064949291E',
    'A': '7E1111117E', 'B': '7F49494936', 'C': '3E41414122', 'D': '7F4141221C',
    'E': '7F49494941', 'F': '7F09090901', 'G': '3E4149497A', 'H': '7F0808087F',
    'I': '00417F4100', 'J': '2040413F01', 'K': '7F08142241', 'L': '7F40404040',
    'M': '7F020C027F', 'N': '7F0408107F', 'O': '3E4141413E', 'P': '7F09090906',
    'Q': '3E4151215E', 'R': '7F09192946', 'S': '4649494931', 'T': '01017F0101',
    'U': '3F4040403F', 'V': '1F2040201F', 'W': '7F2018207F', 'X': '6314081463',
    'Y': '0708700807', 'Z': '6151494543', '-': '0808080808', '.': '0060600000',
    ':': '0036360000', '!': '00005F0000', '/': '2010080402', '*': '14083E0814',
    '+': '08083E0808', '>': '4122140800', '<': '0814224100', '(': '001C224100',
    ')': '0041221C00', '?': '0201510906', ',': '0050300000', "'": '0007000000',
    '%': '2313086462', '#': '147F147F14', '=': '1414141414', '$': '2649792412',
    '"': '0007000700', '[': '007F414100', ']': '0041417F00', '_': '4040404040',
    '@': '3E7F7F7F3E' /* filled blob */
  };
  for (const k in D) {
    const cols = [];
    for (let i = 0; i < 5; i++) cols.push(parseInt(D[k].substr(i * 2, 2), 16));
    FONT[k] = cols;
  }
})();

function textWidth(s, px, sp) { sp = sp === undefined ? 1 : sp; return s.length * (5 * px + sp * px) - sp * px; }

/* draw chunky pixel text.  px = pixel size. */
function drawText(ctx, s, x, y, px, color, spacing) {
  spacing = spacing === undefined ? 1 : spacing;
  ctx.fillStyle = color;
  s = String(s).toUpperCase();
  let cx = x;
  for (let i = 0; i < s.length; i++) {
    const g = FONT[s[i]] || FONT['?'];
    for (let c = 0; c < 5; c++) {
      const bits = g[c];
      for (let r = 0; r < 7; r++) if (bits & (1 << r)) ctx.fillRect(cx + c * px, y + r * px, px, px);
    }
    cx += (5 + spacing) * px;
  }
  return cx;
}
function drawTextC(ctx, s, cx, y, px, color, spacing) {
  drawText(ctx, s, Math.round(cx - textWidth(String(s), px, spacing) / 2), y, px, color, spacing);
}

/* comma grouped number */
function fmt(n) {
  n = Math.floor(n);
  let s = String(n), o = '';
  while (s.length > 3) { o = ',' + s.slice(-3) + o; s = s.slice(0, -3); }
  return s + o;
}

/* ---------------------------------------------------- dithered gradients */
/* 4x4 bayer matrix: the era's only legal gradient. */
const BAYER = [
  [0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]
];
/* Fills rect with a vertical two-colour dither ramp (no smooth gradients). */
function ditherRectV(ctx, x, y, w, h, cTop, cBot, t0, t1) {
  t0 = t0 === undefined ? 0 : t0; t1 = t1 === undefined ? 1 : t1;
  x |= 0; y |= 0; w |= 0; h |= 0;
  ctx.fillStyle = cTop; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = cBot;
  for (let j = 0; j < h; j++) {
    const t = lerp(t0, t1, h <= 1 ? 1 : j / (h - 1));
    const lvl = t * 16;
    for (let i = 0; i < w; i++) {
      if (BAYER[j & 3][i & 3] < lvl) ctx.fillRect(x + i, y + j, 1, 1);
    }
  }
}
/* radial dither blob, for lamp glow */
function ditherGlow(ctx, cx, cy, r, color, strength) {
  const x0 = Math.floor(cx - r), x1 = Math.ceil(cx + r);
  const y0 = Math.floor(cy - r), y1 = Math.ceil(cy + r);
  ctx.fillStyle = color;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy);
    if (d > r) continue;
    const t = (1 - d / r) * strength;
    if (BAYER[y & 3][x & 3] < t * 16) ctx.fillRect(x, y, 1, 1);
  }
}
/* ==========================================================================
   PHYSICS CORE
   Continuous collision detection only.  Every moving circle is swept against
   every collider; the earliest time of impact wins, we advance exactly to it,
   resolve, and keep spending the remainder of the timestep.  Nothing is ever
   moved through a wall and pushed back out afterwards, so nothing tunnels.
   ========================================================================== */

/* --------------------------------------------------------------- materials
   Each surface gets its own bounce, its own friction, and its own voice. */
const MAT = {
  wall:    { e: 0.34, f: 0.030, snd: 'wall'   },  /* painted wood cabinet    */
  metal:   { e: 0.26, f: 0.020, snd: 'metal'  },  /* ramp rails, dead        */
  wire:    { e: 0.12, f: 0.040, snd: 'wire'   },  /* wireform habitrail      */
  plastic: { e: 0.46, f: 0.035, snd: 'plastic'},  /* lane guides, in between */
  rubber:  { e: 0.70, f: 0.140, snd: 'rubber' },  /* sling & post rubber     */
  post:    { e: 0.76, f: 0.110, snd: 'post'   },  /* live rubber post        */
  target:  { e: 0.38, f: 0.070, snd: 'target' },
  flipper: { e: 0.32, f: 0.240, snd: 'fliphit'},
  bumper:  { e: 0.55, f: 0.060, snd: 'bumper' },
  flesh:   { e: 0.50, f: 0.220, snd: 'flesh'  }   /* creatures               */
};

/* ------------------------------------------------------------ ray helpers */
/* first t >= 0 where |p + t*d - c| == R, starting strictly outside. -1 = none */
function rayCircleT(px, py, dx, dy, cx, cy, R) {
  const mx = px - cx, my = py - cy;
  const a = dx * dx + dy * dy;
  if (a < EPS) return -1;
  const b = 2 * (mx * dx + my * dy);
  const c = mx * mx + my * my - R * R;
  if (c < 0) return -1;               /* started inside: caller handles it   */
  const disc = b * b - 4 * a * c;
  if (disc < 0) return -1;
  const s = Math.sqrt(disc);
  const t = (-b - s) / (2 * a);
  return t >= 0 ? t : -1;
}

function closestOnSeg(px, py, ax, ay, bx, by) {
  const ex = bx - ax, ey = by - ay;
  const l2 = ex * ex + ey * ey;
  let u = l2 < EPS ? 0 : ((px - ax) * ex + (py - ay) * ey) / l2;
  u = clamp(u, 0, 1);
  return [ax + ex * u, ay + ey * u, u];
}

/* --------------------------------------------------- swept circle vs capsule
   Circle of radius r at p moving by (dx,dy) against segment a..b thickened by
   sr.  Returns {t, nx, ny, depth} or null.  depth > 0 means it was already
   overlapping at t = 0 and must be pushed out.                            */
function sweepCapsule(px, py, dx, dy, r, ax, ay, bx, by, sr) {
  const R = r + sr;
  /* ---- already touching? */
  const cp = closestOnSeg(px, py, ax, ay, bx, by);
  let nx = px - cp[0], ny = py - cp[1];
  let d = Math.hypot(nx, ny);
  if (d < R - 1e-4) {
    if (d < 1e-5) {                       /* dead centre: use segment normal */
      const ex = bx - ax, ey = by - ay, el = Math.hypot(ex, ey) || 1;
      nx = -ey / el; ny = ex / el;
    } else { nx /= d; ny /= d; }
    return { t: 0, nx: nx, ny: ny, depth: R - d };
  }
  let best = Infinity, bnx = 0, bny = 0;
  /* ---- flat face */
  const ex = bx - ax, ey = by - ay, el = Math.hypot(ex, ey);
  if (el > EPS) {
    const ux = ex / el, uy = ey / el;
    const lnx = -uy, lny = ux;                       /* line normal (either) */
    const s0 = (px - ax) * lnx + (py - ay) * lny;
    const sd = dx * lnx + dy * lny;
    if (Math.abs(sd) > EPS) {
      const sg = s0 >= 0 ? 1 : -1;
      const t = (sg * R - s0) / sd;
      if (t >= 0 && t <= 1) {
        const hx = px + dx * t, hy = py + dy * t;
        const u = ((hx - ax) * ux + (hy - ay) * uy) / el;
        if (u >= 0 && u <= 1) { best = t; bnx = sg * lnx; bny = sg * lny; }
      }
    }
  }
  /* ---- round caps */
  for (let i = 0; i < 2; i++) {
    const qx = i ? bx : ax, qy = i ? by : ay;
    const t = rayCircleT(px, py, dx, dy, qx, qy, R);
    if (t >= 0 && t <= 1 && t < best) {
      let hx = px + dx * t - qx, hy = py + dy * t - qy;
      const hl = Math.hypot(hx, hy) || 1;
      best = t; bnx = hx / hl; bny = hy / hl;
    }
  }
  if (best === Infinity) return null;
  return { t: best, nx: bnx, ny: bny, depth: 0 };
}

/* ------------------------------------------------------ swept circle vs arc
   A curved wall, solid from both faces — the same way a segment is.  Which
   side the ball is on is decided per query, not baked into the collider, so
   a ball approaching the back of an orbit guide bounces off it instead of
   being teleported through.                                              */
function sweepArc(px, py, dx, dy, r, cx, cy, R, a0, a1) {
  const mx = px - cx, my = py - cy;
  const d0 = Math.hypot(mx, my);
  const outside = d0 >= R;
  const Rt = outside ? R + r : R - r;
  if (Rt <= 0) return null;
  const s = outside ? 1 : -1;
  /* straddling the wall right now */
  const pen = outside ? (d0 < Rt - 1e-4) : (d0 > Rt + 1e-4);
  if (pen) {
    const ang = Math.atan2(my, mx);
    if (!angInArc(ang, a0, a1)) return null;
    const ux = mx / (d0 || 1), uy = my / (d0 || 1);
    return { t: 0, nx: s * ux, ny: s * uy, depth: Math.abs(Rt - d0) };
  }
  const a = dx * dx + dy * dy;
  if (a < EPS) return null;
  const b = 2 * (mx * dx + my * dy);
  const c = mx * mx + my * my - Rt * Rt;
  const disc = b * b - 4 * a * c;
  if (disc < 0) return null;
  const sq = Math.sqrt(disc);
  const ts = [(-b - sq) / (2 * a), (-b + sq) / (2 * a)];
  for (let i = 0; i < 2; i++) {
    const t = ts[i];
    if (t < 0 || t > 1) continue;
    const hx = px + dx * t, hy = py + dy * t;
    const ang = Math.atan2(hy - cy, hx - cx);
    if (!angInArc(ang, a0, a1)) continue;
    const nx = s * (hx - cx) / Rt, ny = s * (hy - cy) / Rt;
    if (dx * nx + dy * ny > 0) continue;             /* leaving the surface */
    return { t: t, nx: nx, ny: ny, depth: 0 };
  }
  return null;
}

/* ------------------------------------------------------------- collider ctors
   Every collider carries a material, an optional trigger callback, and an
   AABB so the broadphase can skip it cheaply. */
let _cid = 1;
function colAABB(c) {
  if (c.k === 'seg') {
    const p = c.r + 24;
    c.x0 = Math.min(c.ax, c.bx) - p; c.x1 = Math.max(c.ax, c.bx) + p;
    c.y0 = Math.min(c.ay, c.by) - p; c.y1 = Math.max(c.ay, c.by) + p;
  } else {
    const p = c.cr + 24;
    c.x0 = c.cx - p; c.x1 = c.cx + p; c.y0 = c.cy - p; c.y1 = c.cy + p;
  }
  return c;
}
function seg(ax, ay, bx, by, mat, o) {
  return colAABB(Object.assign({ id: _cid++, k: 'seg', ax, ay, bx, by, r: 0, mat: mat || MAT.wall, live: true }, o));
}
function cir(cx, cy, cr, mat, o) {
  return colAABB(Object.assign({ id: _cid++, k: 'cir', cx, cy, cr, mat: mat || MAT.post, live: true }, o));
}
function arc(cx, cy, cr, a0deg, a1deg, inner, mat, o) {
  return colAABB(Object.assign({
    id: _cid++, k: 'arc', cx, cy, cr, a0: rad(a0deg), a1: rad(a1deg),
    inner: !!inner, mat: mat || MAT.wall, live: true
  }, o));
}
/* chain of segments through a list of [x,y] points */
function chain(pts, mat, o) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++)
    out.push(seg(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], mat, o));
  return out;
}

/* -------------------------------------------------------------------- ball */
let _ballId = 1;
function makeBall(x, y, vx, vy) {
  return {
    id: _ballId++, x, y, vx: vx || 0, vy: vy || 0,
    r: BALL_R, mass: 1, bounce: 1, fric: 1, wobble: 0,
    spin: 0, spinV: 0,
    state: 'free',        /* free | lane | ramp | held | gone */
    ramp: null, hold: null, holdT: 0,
    trail: [], lastHit: 0, stuckT: 0, lastX: x, lastY: y,
    inPlunger: false, launched: false, glow: 0
  };
}
const BALL_R = 9.6;

/* ------------------------------------------------------------ the response
   Impulse against a (possibly moving) surface.  contactVel is the surface's
   own velocity at the contact point — this is what makes a flipper transfer
   angular momentum instead of behaving like a wall. */
function respond(ball, nx, ny, mat, cvx, cvy, extraE) {
  cvx = cvx || 0; cvy = cvy || 0;
  const rvx = ball.vx - cvx, rvy = ball.vy - cvy;
  const vn = rvx * nx + rvy * ny;
  if (vn > 0) return 0;                              /* already separating */
  let e = mat.e * ball.bounce * (extraE === undefined ? 1 : extraE);
  const sp = -vn;
  /* soft landing: kill restitution at low speed so balls settle and cradle */
  if (sp < 70) e *= sp / 70;
  if (sp < 12) e = 0;
  const j = -(1 + e) * vn;
  ball.vx += j * nx; ball.vy += j * ny;
  /* coulomb-ish friction along the tangent, also spins the ball */
  const tx = -ny, ty = nx;
  const vt = rvx * tx + rvy * ty;
  const mu = mat.f * ball.fric;
  const jt = clamp(-vt, -mu * j, mu * j);
  ball.vx += jt * tx; ball.vy += jt * ty;
  ball.spinV += -jt * 0.06;
  return sp;
}

/* ----------------------------------------------------------- the main sweep
   `dyn` is a list of dynamic colliders that also expose vel(x,y). */
function sweepAll(ball, dx, dy, statics, dyn) {
  let best = null;
  const r = ball.r;
  const bx0 = Math.min(ball.x, ball.x + dx) - r, bx1 = Math.max(ball.x, ball.x + dx) + r;
  const by0 = Math.min(ball.y, ball.y + dy) - r, by1 = Math.max(ball.y, ball.y + dy) + r;
  for (let pass = 0; pass < 2; pass++) {
    const list = pass ? dyn : statics;
    if (!list) continue;
    for (let i = 0; i < list.length; i++) {
      const c = list[i];
      if (!c.live) continue;
      if (c.x1 < bx0 || c.x0 > bx1 || c.y1 < by0 || c.y0 > by1) continue;
      let h = null;
      if (c.k === 'seg')      h = sweepCapsule(ball.x, ball.y, dx, dy, r, c.ax, c.ay, c.bx, c.by, c.r);
      else if (c.k === 'cir') h = sweepCapsule(ball.x, ball.y, dx, dy, r, c.cx, c.cy, c.cx, c.cy, c.cr);
      else                    h = sweepArc(ball.x, ball.y, dx, dy, r, c.cx, c.cy, c.cr, c.a0, c.a1, c.inner);
      if (!h) continue;
      /* one-way gates: only solid when hit from the allowed side */
      if (c.oneWay && (h.nx * c.oneWay[0] + h.ny * c.oneWay[1]) < 0.15) continue;
      if (best === null || h.t < best.t - 1e-9 ||
          (Math.abs(h.t - best.t) < 1e-9 && h.depth > best.depth)) { h.col = c; best = h; }
    }
  }
  return best;
}

/* ------------------------------------------------------- integrate one ball
   Called with a small fixed dt.  Velocity-scaled substepping on top of CCD:
   belt and braces, because the flippers and creatures move too. */
function stepBall(ball, dt, env, statics, dyn, onHit) {
  const sp = Math.hypot(ball.vx, ball.vy);
  let sub = Math.ceil((sp * dt) / (ball.r * 0.45));
  sub = clamp(sub, 1, 24);
  const h = dt / sub;
  for (let s = 0; s < sub; s++) {
    if (ball.state !== 'free') return;
    /* table pitch + any level gravity modifier, plus nudge acceleration */
    ball.vx += (env.gx + env.nudgeAx) * h;
    ball.vy += (env.gy + env.nudgeAy) * h;
    /* rolling friction: the long return lanes must visibly bleed speed */
    const s2 = Math.hypot(ball.vx, ball.vy);
    if (s2 > 0) {
      const drag = (env.roll * ball.fric) * h;
      const k = Math.max(0, 1 - drag / Math.max(s2, 1));
      ball.vx *= k; ball.vy *= k;
    }
    let remain = 1;
    let dx = ball.vx * h, dy = ball.vy * h;
    for (let iter = 0; iter < 6 && remain > 1e-5; iter++) {
      const hit = sweepAll(ball, dx * remain, dy * remain, statics, dyn);
      if (!hit) { ball.x += dx * remain; ball.y += dy * remain; break; }
      const t = clamp(hit.t, 0, 1);
      ball.x += dx * remain * t; ball.y += dy * remain * t;
      const c = hit.col;
      /* de-penetrate */
      if (hit.depth > 0) { ball.x += hit.nx * (hit.depth + 0.05); ball.y += hit.ny * (hit.depth + 0.05); }
      /* wobbly balls do not present a clean contact normal */
      let nx = hit.nx, ny = hit.ny;
      if (ball.wobble > 0) {
        const j = (rnd() - 0.5) * ball.wobble;
        const cs = Math.cos(j), sn = Math.sin(j);
        const tx = nx * cs - ny * sn; ny = nx * sn + ny * cs; nx = tx;
      }
      let cvx = 0, cvy = 0;
      if (c.vel) { const v = c.vel(ball.x, ball.y); cvx = v[0]; cvy = v[1]; }
      const speed = respond(ball, nx, ny, c.mat, cvx, cvy, c.eMul);
      /* nudge the ball off the surface so the next sweep starts clean */
      ball.x += nx * 0.03; ball.y += ny * 0.03;
      if (onHit && speed > 0) onHit(ball, c, speed, nx, ny);
      remain *= (1 - t);
      dx = ball.vx * h; dy = ball.vy * h;
      if (ball.state !== 'free') return;
    }
    /* hard speed cap keeps the CCD honest no matter what stacks up */
    const sp2 = Math.hypot(ball.vx, ball.vy);
    if (sp2 > MAX_SPEED) { const k = MAX_SPEED / sp2; ball.vx *= k; ball.vy *= k; }
    ball.spin += ball.spinV * h;
    ball.spinV *= (1 - 1.2 * h);
  }
}
const MAX_SPEED = 2900;

/* ==========================================================================
   FLIPPER — a rotating rigid body, not a wall that teleports.
   The contact point's distance from the pivot sets the kick, so a ball taken
   at the tip leaves harder and flatter than one taken at the base.
   ========================================================================== */
class Flipper {
  constructor(o) {
    this.px = o.px; this.py = o.py;
    this.baseLen = o.len; this.len = o.len;
    this.rad = o.rad === undefined ? 6.2 : o.rad;
    this.restA = rad(o.rest); this.upA = rad(o.up);
    this.side = o.side;                       /* -1 = left button, 1 = right */
    this.upper = !!o.upper;
    this.ang = this.restA; this.omega = 0;
    this.held = false; this.enabled = true;
    this.powerMul = 1; this.lenMul = 1;
    this.flashT = 0;
    /* collider proxy handed to the sweep, refreshed every substep */
    const self = this;
    this.col = {
      id: _cid++, k: 'seg', r: this.rad, mat: MAT.flipper, live: true, tag: 'flipper',
      ax: 0, ay: 0, bx: 0, by: 0, x0: 0, x1: 0, y0: 0, y1: 0, owner: this,
      vel: function (x, y) {
        const rx = x - self.px, ry = y - self.py;
        return [-self.omega * ry, self.omega * rx];
      }
    };
    this.sync();
  }
  tipX() { return this.px + Math.cos(this.ang) * this.len; }
  tipY() { return this.py + Math.sin(this.ang) * this.len; }
  sync() {
    const c = this.col;
    c.ax = this.px; c.ay = this.py; c.bx = this.tipX(); c.by = this.tipY();
    c.r = this.rad; c.live = true;
    colAABB(c);
  }
  update(dt) {
    this.len = this.baseLen * this.lenMul;
    const want = (this.held && this.enabled) ? this.upA : this.restA;
    const d = want - this.ang;
    /* solenoid drives hard on the way up, spring returns lazily */
    const goingUp = (want === this.upA);
    const maxW = (goingUp ? 33 * this.powerMul : 15) * (this.upper ? 1.05 : 1);
    const accel = goingUp ? 5200 * this.powerMul : 1400;
    let desired = clamp(d * 90, -maxW, maxW);
    const dw = clamp(desired - this.omega, -accel * dt, accel * dt);
    this.omega += dw;
    let na = this.ang + this.omega * dt;
    if ((d > 0 && na > want) || (d < 0 && na < want)) { na = want; this.omega = 0; }
    this.ang = na;
    if (this.flashT > 0) this.flashT -= dt;
    this.sync();
  }
  /* Push a ball that the swinging flipper has swept over.  The CCD above
     handles the ball moving into the flipper; this handles the flipper
     moving into the ball. */
  resolveSwept(ball) {
    if (ball.state !== 'free') return 0;
    const c = this.col;
    const cp = closestOnSeg(ball.x, ball.y, c.ax, c.ay, c.bx, c.by);
    let nx = ball.x - cp[0], ny = ball.y - cp[1];
    let d = Math.hypot(nx, ny);
    const R = ball.r + this.rad;
    if (d >= R) return 0;
    if (d < 1e-5) { nx = 0; ny = -1; d = 1e-5; } else { nx /= d; ny /= d; }
    ball.x += nx * (R - d + 0.05); ball.y += ny * (R - d + 0.05);
    const v = c.vel(ball.x, ball.y);
    return respond(ball, nx, ny, MAT.flipper, v[0], v[1]);
  }
}
/* ==========================================================================
   THE TABLE — "FATHOM"
   A tall playfield, 424 x 960 table units, viewed through two panes.
   All geometry is authored here in table space.
   ========================================================================== */

const TW = 424, TH = 960;
const DRAIN_Y = 934;

/* pitch: 6.5 degrees, real gravity scaled into table pixels (0.72 px/mm) */
const BASE_G = 9810 * 0.72 * Math.sin(rad(6.5));   /* ~800 px/s^2 */
const BASE_ROLL = 65;

/* ------------------------------------------------------------- sensors ---
   Triggers are kept out of the collision sweep: a ball either sits inside a
   circle or crosses a line this tick.  Cheap and impossible to tunnel past. */
function segCross(x0, y0, x1, y1, ax, ay, bx, by) {
  const d1x = x1 - x0, d1y = y1 - y0, d2x = bx - ax, d2y = by - ay;
  const den = d1x * d2y - d1y * d2x;
  if (Math.abs(den) < 1e-9) return false;
  const t = ((ax - x0) * d2y - (ay - y0) * d2x) / den;
  const u = ((ax - x0) * d1y - (ay - y0) * d1x) / den;
  return t >= 0 && t <= 1 && u >= 0 && u <= 1;
}

/* --------------------------------------------------------------------------
   buildTable() constructs every collider and every element record.
   Called once; per-level changes mutate the returned structure.
   -------------------------------------------------------------------------- */
function buildTable() {
  const S = [];                                  /* static colliders        */
  const push = (...c) => { c.forEach(x => Array.isArray(x) ? S.push(...x) : S.push(x)); };
  const T = {
    S, dyn: [], sensors: [],
    w: TW, h: TH
  };

  /* ---------------------------------------------------------- outer shell */
  push(seg(14, 150, 14, 884, MAT.wall, { tag: 'wallL' }));
  push(arc(110, 150, 96, 180, 270, true, MAT.wall, { tag: 'arcTL' }));
  push(seg(110, 54, 301, 54, MAT.wall, { tag: 'wallT' }));
  push(arc(314, 150, 96, 262, 360, true, MAT.wall, { tag: 'arcTR' }));
  push(seg(410, 150, 410, 946, MAT.wall, { tag: 'wallR' }));
  push(seg(380, 946, 410, 946, MAT.wall, { tag: 'laneFloor' }));
  /* drain funnel */
  push(seg(14, 884, 64, 946, MAT.wall, { tag: 'drainL' }));
  push(seg(380, 884, 330, 946, MAT.wall, { tag: 'drainR' }));

  /* ------------------------------------------------- plunger lane divider */
  push(seg(380, 946, 380, 190, MAT.metal, { r: 2.5, tag: 'divider' }));
  push(cir(380, 190, 4, MAT.post, { tag: 'divcap' }));
  /* one-way gate: balls leave the lane, nothing comes back in */
  push(seg(382, 186, 409, 172, MAT.metal, { r: 2, tag: 'owgate', oneWay: [-0.46, -0.89] }));

  /* --------------------------------------------------- skill shot lanes --
     Five dividers hang under the top wall.  A ball coming over the top skims
     across them and drops into a lane; how far it gets is the skill shot.  */
  const LANE_X = [326, 288, 250, 212, 174];
  T.laneDiv = [];
  LANE_X.forEach(x => { const c = seg(x, 86, x, 150, MAT.plastic, { r: 2.5, tag: 'lanediv' }); push(c); T.laneDiv.push(c); });
  T.rollovers = [
    { x: 193, y: 120, letter: 'D', lit: false, flash: 0 },
    { x: 231, y: 120, letter: 'I', lit: false, flash: 0 },
    { x: 269, y: 120, letter: 'V', lit: false, flash: 0 },
    { x: 307, y: 120, letter: 'E', lit: false, flash: 0 }
  ];
  T.rollovers.forEach((ro, i) => T.sensors.push({
    k: 'seg', ax: ro.x - 18, ay: ro.y, bx: ro.x + 18, by: ro.y, tag: 'rollover', idx: i, cool: 0.35
  }));

  /* ----------------------------------------------------------- orbit lanes
     Both side lanes end in a quarter-turn chute: the outer wall curves too,
     so a ball coming down an orbit is thrown across the playfield instead of
     falling free into an outlane.  A weak orbit shot dribbles out of the
     chute mouth and can still be lost — which is exactly the trade a real
     orbit shot offers. */
  push(arc(110, 150, 62, 180, 252, false, MAT.plastic, { tag: 'orbitTop' }));
  /* left: inner guide, then the turn */
  /* The turn stops 20 degrees short of horizontal so the exit still runs
     downhill — a chute that flattens out is a chute balls park in. */
  push(seg(48, 150, 48, 392, MAT.plastic, { r: 3, tag: 'orbitGuide' }));
  push(arc(80, 392, 32, 110, 180, false, MAT.plastic, { tag: 'orbitGuide' }));
  push(arc(80, 392, 66, 110, 180, true, MAT.wall, { tag: 'chuteL' }));
  /* right: mirrored */
  push(seg(346, 236, 346, 392, MAT.plastic, { r: 3, tag: 'orbitGuideR' }));
  push(cir(346, 236, 4.5, MAT.post, { tag: 'orbitCapR' }));
  push(arc(314, 392, 32, 0, 70, false, MAT.plastic, { tag: 'orbitGuideR' }));
  push(arc(314, 392, 66, 0, 70, true, MAT.wall, { tag: 'chuteR' }));
  /* outlane guides: the outlane mouth is the slot under each chute */
  push(seg(46, 504, 43, 690, MAT.plastic, { r: 3, tag: 'outguideL' }));
  push(seg(346, 504, 349, 690, MAT.plastic, { r: 3, tag: 'outguideR' }));
  push(cir(46, 504, 5, MAT.post, { tag: 'post' }));
  push(cir(346, 504, 5, MAT.post, { tag: 'post' }));
  push(cir(62, 494, 5, MAT.post, { tag: 'post' }));
  push(cir(330, 494, 5, MAT.post, { tag: 'post' }));
  /* spinner sits in the lane */
  T.spinner = { x: 31, y: 330, ang: 0, vel: 0, count: 0, lit: false, flash: 0 };
  T.sensors.push({ k: 'seg', ax: 15, ay: 330, bx: 47, by: 330, tag: 'spinner', cool: 0.05 });
  /* orbit passes: crossing the top of either side lane counts */
  T.sensors.push({ k: 'seg', ax: 15, ay: 210, bx: 47, by: 210, tag: 'orbit', side: 'L', cool: 0.5 });
  T.sensors.push({ k: 'seg', ax: 347, ay: 300, bx: 378, by: 300, tag: 'orbit', side: 'R', cool: 0.5 });

  /* --------------------------------------------------------- lower guides */
  /* left: outlane / inlane divider, then the ramp down to the flipper base */
  push(chain([[43, 690], [62, 792], [122, 842]], MAT.plastic, { r: 3, tag: 'guideL' }));
  push(chain([[349, 690], [330, 792], [270, 842]], MAT.plastic, { r: 3, tag: 'guideR' }));
  push(cir(43, 690, 4.5, MAT.post, { tag: 'postL' }));
  push(cir(349, 690, 4.5, MAT.post, { tag: 'postR' }));
  push(seg(378, 700, 378, 884, MAT.wall, { tag: 'wallRlow' }));

  /* ------------------------------------------------------------ slingshots */
  function sling(ax, ay, bx, by, cx2, cy2, side) {
    const face = seg(ax, ay, bx, by, MAT.rubber, { r: 3, tag: 'sling', side });
    push(face);
    push(seg(ax, ay, cx2, cy2, MAT.plastic, { r: 2, tag: 'slingback' }));
    push(seg(cx2, cy2, bx, by, MAT.plastic, { r: 2, tag: 'slingback' }));
    /* outward normal of the face, pointing away from the third vertex */
    let nx = -(by - ay), ny = (bx - ax);
    const L = Math.hypot(nx, ny); nx /= L; ny /= L;
    if ((cx2 - ax) * nx + (cy2 - ay) * ny > 0) { nx = -nx; ny = -ny; }
    const o = { face, nx, ny, flash: 0, side, cx: (ax + bx) / 2, cy: (ay + by) / 2, ax, ay, bx, by, tx: cx2, ty: cy2 };
    face.slingRef = o;
    return o;
  }

  /* -------------------------------------------------------------- flippers */
  T.flipL = new Flipper({ px: 128, py: 846, len: 55, rad: 6.2, rest: 32, up: -32, side: -1 });

    { x: 140, y: 266, r: 16, flash: 0, lit: true },
    { x: 112, y: 358, r: 16, flash: 0, lit: true }

  T.bumpers.forEach((b, i) => {
    const c = cir(b.x, b.y, b.r, MAT.bumper, { tag: 'bumper', idx: i });
    b.col = c; push(c);
  });

  /* --------------------------------------------------------- drop targets */
  T.drops = [];
  {
    const a = Math.atan2(668 - 600, 96 - 66);      /* bank runs up to the right */
    const hx = Math.cos(a) * 9, hy = Math.sin(a) * 9;
    for (let i = 0; i < 4; i++) {
      const t = i / 3;
      const x = lerp(68, 96, t), y = lerp(602, 666, t);
      const c = seg(x - hx, y - hy, x + hx, y + hy, MAT.target, { r: 3, tag: 'drop', idx: i });
      T.drops.push({ x, y, a, down: false, col: c, flash: 0 });
      push(c);
    }
  }
  push(cir(60, 590, 4, MAT.post, { tag: 'post' }));
  push(cir(104, 678, 4, MAT.post, { tag: 'post' }));

  /* ------------------------------------------------------- centre grid ---
     Nine lit targets.  Knock them all out and the gate opens.             */
  T.grid = [];
  const GX = [186, 222, 258], GY = [298, 336, 374];
  for (let r = 0; r < 3; r++) for (let c2 = 0; c2 < 3; c2++) {
    const x = GX[c2], y = GY[r];
    const col = cir(x, y, 6.5, MAT.target, { tag: 'grid', idx: T.grid.length });
    T.grid.push({ x, y, down: false, lit: true, flash: 0, col });
    push(col);
  }

  /* --------------------------------------------------------------- gate ---
     Two panels that slide apart, revealing the lock sockets behind.       */
  T.gate = { open: 0, state: 'closed', t: 0, flash: 0 };
  T.gatePanels = [];
  for (let i = 0; i < 2; i++) {
    const c = seg(0, 238, 0, 238, MAT.metal, { r: 4, tag: 'gate', idx: i });
    T.gatePanels.push(c); push(c);
  }
  T.setGate = function (o) {
    T.gate.open = o;
    const l = T.gatePanels[0], r = T.gatePanels[1];
    const slide = o * 64;
    l.ax = 152 - slide; l.ay = 238; l.bx = 216 - slide; l.by = 238; colAABB(l);
    r.ax = 216 + slide; r.ay = 238; r.bx = 280 + slide; r.by = 238; colAABB(r);
  };
  T.setGate(0);
  /* posts that frame the gate mouth */
  push(cir(146, 238, 5, MAT.post, { tag: 'post' }));
  push(cir(286, 238, 5, MAT.post, { tag: 'post' }));

  /* ------------------------------------------------------- lock sockets --- */
  T.sockets = [
    { x: 180, y: 190, r: 13, filled: false, ball: null, lit: 0, flash: 0 },
    { x: 238, y: 190, r: 13, filled: false, ball: null, lit: 0, flash: 0 }
  ];

  /* ------------------------------------------------------------- saucer --- */
  T.saucer = { x: 222, y: 566, r: 13, ball: null, timer: 0, lit: true, flash: 0, cool: 0, kickA: 108 };
  push(arc(222, 566, 20, 110, 70, true, MAT.plastic, { tag: 'saucerLip' }));

  /* ------------------------------------------------------------- kickback */
  T.kickback = { x: 26, y: 876, charged: false, flash: 0, cool: 0 };

  /* the standup that charges it */
  {

    T.kbTarget = { col: c, flash: 0, x: 60, y: 551 };
    push(c);
  }

  /* --------------------------------------------------------------- ramps ---
     A ramp is a scripted path.  Speed still matters: gravity fights you on
     the climb and a weak shot rolls back out of the entrance.            */
  T.ramps = [
    {
      /* up the right wall, round the turn at the top, then down the outer
         wireform and into the right inlane */
      name: 'CURRENT RAMP', short: 'RAMP',
      entry: [264, 590, 330, 554],           /* crossing line               */
      dirx: 0.34, diry: -0.94,               /* required travel direction   */
      minV: 520, climb: 0.46,
      path: [[300, 568], [310, 512], [320, 452], [328, 392], [332, 330], [334, 268],
             [340, 224], [356, 204], [370, 222], [374, 300], [372, 400], [366, 500],
             [358, 600], [350, 690]],
      flash: 0, lit: false
    },
    {
      /* the habitrail: up the middle corridor, over the top and all the way
         across to feed the upper flipper */
      name: 'HABITRAIL', short: 'RAIL',
      entry: [136, 510, 180, 488],
      dirx: 0.16, diry: -0.99,
      minV: 560, climb: 0.52,
      path: [[178, 488], [176, 430], [172, 368], [170, 306], [172, 248], [184, 202],
             [212, 176], [248, 172], [278, 190], [292, 232], [296, 300], [294, 372],
             [290, 420]],
      flash: 0, lit: false
    }
  ];
  T.ramps.forEach(r => {
    let L = 0; r.seg = [];
    for (let i = 0; i < r.path.length - 1; i++) {
      const d = dist(r.path[i][0], r.path[i][1], r.path[i + 1][0], r.path[i + 1][1]);
      r.seg.push({ d, at: L }); L += d;
    }
    r.len = L;
    T.sensors.push({ k: 'seg', ax: r.entry[0], ay: r.entry[1], bx: r.entry[2], by: r.entry[3], tag: 'ramp', ref: r, cool: 0.25 });
  });

  /* ---------------------------------------------------- assorted rubber --- */
  push(cir(212, 452, 6, MAT.post, { tag: 'post' }));
  push(cir(268, 556, 5, MAT.post, { tag: 'post' }));
  push(cir(176, 556, 5, MAT.post, { tag: 'post' }));
  push(cir(60, 640, 5, MAT.post, { tag: 'post' }));
  push(cir(334, 640, 5, MAT.post, { tag: 'post' }));
  push(cir(300, 116, 5, MAT.post, { tag: 'post' }));

  /* short guide walls that keep the upper flipper's feed honest */
  push(seg(322, 470, 322, 540, MAT.plastic, { r: 2.5, tag: 'guideU' }));

  /* --------------------------------------------------------------- misc --- */
  T.plunger = { y: 0, power: 0, charging: false, released: 0, x: 396 };
  T.lamps = [];
  return T;
}

/* --------------------------------------------------- ramp path evaluation */
function rampPoint(r, s) {
  s = clamp(s, 0, r.len);
  for (let i = 0; i < r.seg.length; i++) {
    const sg = r.seg[i];
    if (s <= sg.at + sg.d || i === r.seg.length - 1) {
      const u = sg.d < EPS ? 0 : (s - sg.at) / sg.d;
      const a = r.path[i], b = r.path[i + 1];
      const x = lerp(a[0], b[0], u), y = lerp(a[1], b[1], u);
      const dx = b[0] - a[0], dy = b[1] - a[1], dl = Math.hypot(dx, dy) || 1;
      return [x, y, dx / dl, dy / dl];
    }
  }
  return [r.path[0][0], r.path[0][1], 0, -1];
}

  creatures: [], nextCreature: 0,
  ballSaveT: 0, mbActive: false, jackpots: 0, jackpotLit: false, superLit: false,
  mode2: null,             /* running timed mode */
  hiscores: [
    { n: 'VANCE', s: 4200000 }, { n: 'OKONKWO', s: 3100000 }, { n: 'REYES', s: 2400000 },
    { n: 'LIN', s: 1600000 }, { n: 'ASH', s: 900000 }
  ],
  hiEntry: null, hiName: [0, 0, 0], hiPos: 0,
  cutoutT: 0, cutoutWhich: 0, cutoutWarn: 0,
  attractT: 0, seq: null
};

function newPlayer(i) {
  return {
    idx: i, score: 0, ball: 1, level: 0, done: false,
    prog: { drops: 0, spins: 0, grid: 0, ramps: 0, pops: 0, mode: 0, multiball: 0, orbits: 0, kills: 0, super: 0 },
    dive: [false, false, false, false], bonusX: 1, bonusBase: 0,
    extraBalls: 0, gotExtra: false, locks: 0, deepest: 0
  };
}
function P() { return G.players[G.cur]; }
function LV() { return LEVELS[Math.min(P().level, LEVELS.length - 1)]; }

/* --------------------------------------------------------------- messages */
function say(text, sub, time) {
  G.msgs.unshift({ text: text, sub: sub || '', t: time || 2.2, max: time || 2.2 });
  if (G.msgs.length > 4) G.msgs.length = 4;
}
/* tiny in-game scheduler so delays pause with the game */
const TIMERS = [];
function later(t, fn) { TIMERS.push({ t, fn }); }
function updateTimers(dt) {
  for (let i = TIMERS.length - 1; i >= 0; i--) {
    TIMERS[i].t -= dt;
    if (TIMERS[i].t <= 0) { const f = TIMERS[i].fn; TIMERS.splice(i, 1); f(); }
  }
}
function popup(x, y, text, col) {
  G.pops.push({ x, y, text: String(text), t: 1.0, col: col || PAL.white });
  if (G.pops.length > 26) G.pops.shift();
}

/* ----------------------------------------------------------------- scoring */
function award(pts, x, y, label) {
  const p = P();
  if (!p) return;
  const mult = 1 + p.level * 0.25;
  const v = Math.round(pts * mult);
  p.score += v;
  p.bonusBase += Math.round(pts * 0.10);
  if (x !== undefined) popup(x, y, fmt(v), label || PAL.amber);
  if (p.score > 0 && !p.gotExtra && p.score >= 2500000) {
    p.gotExtra = true; p.extraBalls++; say('EXTRA BALL', 'SCORE AWARD', 3); sfx('extra');
  }
}

/* ================================================================ creatures
   Real collision bodies on the upper playfield.  They obey exactly the same
   sweep the walls do — the ball never passes through one. */
function spawnCreature(type) {
  const c = { type, hp: 3, t: rnd() * 6, dead: 0, flash: 0, state: 'idle', hold: 0, ball: null };
  if (type === 'drifter') {
    c.x = rndR(90, 300); c.y = rndR(180, 420); c.r = 13; c.hp = 3;
    c.ox = c.x; c.oy = c.y; c.ax = rndR(50, 90); c.ay = rndR(24, 46);
    c.sx = rndR(0.5, 0.9); c.sy = rndR(0.7, 1.3);
  } else if (type === 'gulper') {
    c.x = 240; c.y = 430; c.r = 17; c.hp = 5;
    c.ox = 236; c.oy = 420; c.ax = 74; c.ay = 66; c.sx = 0.42; c.sy = 0.63;
    c.mouth = 0;
  } else { /* lantern: a bar that parks across a lane */
    c.x = 222; c.y = 268; c.r = 6; c.hp = 6; c.half = 22;
    c.ox = 222; c.oy = 268; c.ax = 70; c.ay = 10; c.sx = 0.33; c.sy = 0.9;
  }
  c.px = c.x; c.py = c.y; c.vx = 0; c.vy = 0;
  const self = c;
  if (type === 'lantern') {
    c.col = seg(c.x - c.half, c.y, c.x + c.half, c.y, MAT.flesh, { r: 6, tag: 'creature', ref: c });
  } else {
    c.col = cir(c.x, c.y, c.r, MAT.flesh, { tag: 'creature', ref: c });
  }
  c.col.vel = function () { return [self.vx, self.vy]; };
  G.creatures.push(c);
  G.T.dyn.push(c.col);
  return c;
}
function clearCreatures() {
  G.creatures.forEach(c => { const i = G.T.dyn.indexOf(c.col); if (i >= 0) G.T.dyn.splice(i, 1); });
  G.creatures.length = 0;
}
function updateCreatures(dt) {
  for (let i = G.creatures.length - 1; i >= 0; i--) {
    const c = G.creatures[i];
    if (c.flash > 0) c.flash -= dt;
    if (c.dead > 0) {
      c.dead -= dt;
      if (c.dead <= 0) {
        const k = G.T.dyn.indexOf(c.col); if (k >= 0) G.T.dyn.splice(k, 1);
        G.creatures.splice(i, 1);
      }
      continue;
    }
    c.t += dt;
    c.px = c.x; c.py = c.y;
    c.x = c.ox + Math.sin(c.t * c.sx) * c.ax;
    c.y = c.oy + Math.sin(c.t * c.sy + 1.3) * c.ay;
    c.vx = (c.x - c.px) / Math.max(dt, 1e-6);
    c.vy = (c.y - c.py) / Math.max(dt, 1e-6);
    if (c.type === 'gulper') {
      c.mouth = (Math.sin(c.t * 1.7) + 1) * 0.5;
      if (c.state === 'full') {
        c.hold -= dt;
        c.col.live = false;
        if (c.hold <= 0) {
          const b = c.ball; c.ball = null; c.state = 'idle'; c.col.live = true;
          if (b) {
            const doom = P().level >= 8 && rnd() < 0.30;
            b.state = 'free';
            b.x = c.x; b.y = c.y + (doom ? 26 : -24);
            const a = doom ? rad(90) : rad(rndR(-140, -40));
            const sp = doom ? 320 : rndR(420, 700);
            b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
            sfx(doom ? 'gulpbad' : 'spit');
            say(doom ? 'SWALLOWED' : 'SPAT OUT', '', 1.4);
          }
        }
      }
    }
    if (c.type === 'lantern') {
      c.col.ax = c.x - c.half; c.col.ay = c.y; c.col.bx = c.x + c.half; c.col.by = c.y;
    } else { c.col.cx = c.x; c.col.cy = c.y; }
    colAABB(c.col);
  }
}
function hitCreature(c, b, speed) {
  if (c.dead > 0) return;
  if (c.type === 'gulper' && c.state === 'idle' && c.mouth > 0.55 && speed < 1400) {
    c.state = 'full'; c.hold = 1.6; c.ball = b;
    b.state = 'held'; b.hold = { k: 'gulper', ref: c };
    sfx('gulp'); say('GULPER HAS IT', '', 1.4); shake(5);
    return;
  }
  if (speed < 140) return;
  c.hp--; c.flash = 0.22;
  award(1500, c.x, c.y);
  sfx('flesh');
  if (c.hp <= 0) {
    c.dead = 0.5; c.col.live = false;
    P().prog.kills++;
    award(12000, c.x, c.y, PAL.lime);
    say('WATCHER DOWN', '', 1.5); shake(6); G.flash = Math.max(G.flash, 0.12);
    sfx('kill'); checkObjective();
  }
}

/* ============================================================ level set-up */
function applyLevel() {
  const p = P(), L = LV();
  const m = L.mods;
  const has = k => m.indexOf(k) >= 0;
  /* gravity / pitch */
  G.env.gy = BASE_G * (has('steep') ? 1.36 : has('lowgrav') ? 0.55 : 1);
  G.env.roll = BASE_ROLL * (has('lowgrav') ? 0.7 : 1);
  /* flippers */
  const T = G.T;
  const lenMul = has('shortflip') ? 0.74 : 1;
  const powMul = has('weak') ? 0.62 : 1;
  T.flipL.lenMul = T.flipR.lenMul = lenMul;
  T.flipL.powerMul = T.flipR.powerMul = T.flipU.powerMul = powMul;
  G.reverse = has('reverse');
  G.cutoutOn = has('cutout');
  /* ball properties */
  G.ballKind = has('ballast') ? 'ballast' : has('floater') ? 'floater' : has('wobble') ? 'wobble' : 'std';
  /* creatures */
  clearCreatures();
  if (has('drifter')) { spawnCreature('drifter'); if (p.level >= 7) spawnCreature('drifter'); }
  if (has('gulper')) spawnCreature('gulper');
  if (has('lantern')) spawnCreature('lantern');
  G.modList = m.slice();
}
function styleBall(b) {
  const k = G.ballKind;
  b.mass = 1; b.bounce = 1; b.fric = 1; b.wobble = 0; b.r = BALL_R; b.kind = k;
  if (k === 'ballast') { b.mass = 1.9; b.bounce = 0.74; b.fric = 1.45; b.r = BALL_R * 1.08; }
  else if (k === 'floater') { b.mass = 0.58; b.bounce = 1.22; b.fric = 0.72; b.r = BALL_R * 0.9; }
  else if (k === 'wobble') { b.mass = 1.15; b.bounce = 1.0; b.fric = 1.15; b.wobble = 0.42; b.r = BALL_R * 1.03; }
  return b;
}

/* ------------------------------------------------------------- objectives */
function checkObjective() {
  if (G.seq) return;                    /* already descending */
  const p = P(), L = LV();
  const o = L.obj;
  if (p.prog[o.k] >= o.n) advanceLevel();
}
/* The descent plays out in slow motion over the live table: the new station
   and its hazards are shown first, and only take effect when the sequence
   ends.  Every rule change is telegraphed before it bites. */
function advanceLevel() {
  const p = P();
  p.deepest = Math.max(p.deepest, p.level);
  award(50000 + p.level * 25000);
  sfx('levelup'); shake(8); G.flash = 0.3;
  p.level++;
  if (p.level >= LEVELS.length) { p.level = LEVELS.length - 1; p.done = true; }
  p.prog = { drops: 0, spins: 0, grid: 0, ramps: 0, pops: 0, mode: 0, multiball: 0, orbits: 0, kills: 0, super: 0 };
  G.seq = { k: 'levelup', t: 0, dur: 4.4 };
}
function resetTableForLevel() {
  const T = G.T;
  T.drops.forEach(d => { d.down = false; d.col.live = true; });
  T.grid.forEach(g => { g.down = false; g.lit = true; g.col.live = true; });
  T.gate.state = 'closed'; T.setGate(0);
  T.sockets.forEach(s => { if (s.ball) { s.ball.state = 'gone'; } s.filled = false; s.ball = null; s.lit = 0; });
  P().locks = 0;
  applyLevel();
  G.balls.forEach(styleBall);
}

/* ================================================================ the loop */
function physTick(dt) {
  const T = G.T;
  /* nudge acceleration decays fast */
  G.env.nudgeAx *= Math.pow(0.0005, dt); G.env.nudgeAy *= Math.pow(0.0005, dt);

  /* flipper solenoids */
  const rev = G.reverse;
  let wantL = rev ? key.right : key.left;
  let wantR = rev ? key.left : key.right;
  if (G.tilt.dead) { wantL = wantR = false; }
  if (G.cutoutT > 0) { if (G.cutoutWhich === 0) wantL = false; else wantR = false; }
  T.flipL.held = wantL; T.flipR.held = wantR; T.flipU.held = wantR;
  T.flippers.forEach(f => f.update(dt));

  updateCreatures(dt);
  updateGate(dt);

  for (let i = 0; i < G.balls.length; i++) {
    const b = G.balls[i];
    if (b.state === 'free') stepBall(b, dt, G.env, T.S, T.dyn, onHit);
    else if (b.state === 'ramp') stepRamp(b, dt);
  }
  /* the flipper swinging into a resting ball */
  for (const f of T.flippers) for (const b of G.balls) if (b.state === 'free') {
    const sp = f.resolveSwept(b);
    if (sp > 220) { sfx('fliphit', clamp(sp / 1600, 0.2, 1)); f.flashT = 0.09; }
  }
  ballVsBall();
  checkSensors(dt);
  drainCheck(dt);
}

function ballVsBall() {
  for (let i = 0; i < G.balls.length; i++) for (let j = i + 1; j < G.balls.length; j++) {
    const a = G.balls[i], b = G.balls[j];
    if (a.state !== 'free' || b.state !== 'free') continue;
    let dx = b.x - a.x, dy = b.y - a.y;
    let d = Math.hypot(dx, dy);
    const R = a.r + b.r;
    if (d >= R || d < 1e-6) continue;
    dx /= d; dy /= d;
    const pen = R - d;
    const ma = a.mass, mb = b.mass, mt = ma + mb;
    a.x -= dx * pen * (mb / mt); a.y -= dy * pen * (mb / mt);
    b.x += dx * pen * (ma / mt); b.y += dy * pen * (ma / mt);
    const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
    const vn = rvx * dx + rvy * dy;
    if (vn > 0) continue;
    const e = 0.86;
    const j2 = -(1 + e) * vn / (1 / ma + 1 / mb);
    a.vx -= j2 * dx / ma; a.vy -= j2 * dy / ma;
    b.vx += j2 * dx / mb; b.vy += j2 * dy / mb;
    if (-vn > 120) sfx('clack', clamp(-vn / 900, 0.15, 0.8));
  }
}

/* ---------------------------------------------------------- ramp travel ---
   The ball leaves the collision world and rides a path.  Gravity still
   fights the climb, so an under-powered shot rolls back out. */
function enterRamp(b, r) {
  const sp = Math.hypot(b.vx, b.vy);
  b.state = 'ramp';
  b.ramp = { r, s: 0, v: sp * 0.94 };
  sfx('rampenter');
  r.flash = 0.4;
}
function stepRamp(b, dt) {
  const rp = b.ramp, r = rp.r;
  const up = rp.s < r.len * r.climb;
  rp.v += (up ? -820 : 520) * dt;
  rp.v -= 40 * dt * Math.sign(rp.v || 1);
  rp.s += rp.v * dt;
  if (rp.s <= 0) {                                   /* rolled back out */
    const p0 = rampPoint(r, 0);
    b.state = 'free'; b.x = p0[0]; b.y = p0[1] + 12;
    b.vx = -p0[2] * 120; b.vy = Math.abs(rp.v) * 0.6 + 90;
    b.ramp = null; sfx('rampfail'); say('ROLLED BACK', '', 1.0);
    return;
  }
  if (rp.s >= r.len) {
    const pe = rampPoint(r, r.len);
    b.state = 'free'; b.x = pe[0]; b.y = pe[1];
    const v = clamp(rp.v, 260, 1000);
    b.vx = pe[2] * v; b.vy = pe[3] * v;
    b.ramp = null;
    rampComplete(r);
    return;
  }
  const p = rampPoint(r, rp.s);
  b.x = p[0]; b.y = p[1];
  b.vx = p[2] * rp.v; b.vy = p[3] * rp.v;
  if (rnd() < dt * 26) sfx('ramproll', 0.25);
}
function rampComplete(r) {
  const p = P();
  p.prog.ramps++;
  r.flash = 0.5;
  award(8000, r.path[r.path.length - 1][0], r.path[r.path.length - 1][1], PAL.cyan);
  say(r.name, 'COMPLETE', 1.2);
  sfx('rampdone');
  if (G.mbActive && G.jackpotLit) jackpot();
  if (G.mode2 && G.mode2.id === 'current') { G.mode2.got++; modeProgress(); }
  checkObjective();
}

/* ------------------------------------------------------------------ gate */
function updateGate(dt) {
  const T = G.T, g = T.gate;
  if (g.flash > 0) g.flash -= dt;
  if (g.state === 'opening') {
    g.t += dt / 1.5;
    T.setGate(clamp(easeOut(g.t), 0, 1));
    if (g.t >= 1) { g.state = 'open'; sfx('gateopen2'); }
    if (rnd() < dt * 22) sfx('gateclank', 0.5);
  } else if (g.state === 'closing') {
    g.t -= dt / 1.1;
    T.setGate(clamp(easeOut(Math.max(g.t, 0)), 0, 1));
    if (g.t <= 0) { g.state = 'closed'; T.setGate(0); sfx('gateshut'); }
  }
}
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 2.2);
function openGate() {
  const T = G.T;
  if (T.gate.state === 'open' || T.gate.state === 'opening') return;
  T.gate.state = 'opening'; T.gate.t = 0; T.gate.flash = 1.2;
  say('THE MOON POOL OPENS', 'LOCK IS LIT', 3);
  sfx('gateopen'); shake(9); G.flash = 0.25;
  T.sockets.forEach(s => s.lit = 1);
}
function closeGate() {
  const T = G.T;
  if (T.gate.state === 'closed' || T.gate.state === 'closing') return;
  T.gate.state = 'closing'; T.gate.t = 1;
  T.sockets.forEach(s => s.lit = 0);
}

/* ============================================================== collisions */
function onHit(b, c, speed, nx, ny) {
  const T = G.T, p = P();
  const loud = clamp(speed / 1500, 0.05, 1);
  switch (c.tag) {
    case 'bumper': {
      const bm = T.bumpers[c.idx];
      bm.flash = 0.2;
      const kick = 560 / b.mass;
      const d = Math.hypot(b.x - bm.x, b.y - bm.y) || 1;
      b.vx += ((b.x - bm.x) / d) * kick; b.vy += ((b.y - bm.y) / d) * kick;
      p.prog.pops++;
      award(500 + p.level * 60, bm.x, bm.y);
      sfx('bumper'); shake(2.2); checkObjective();
      break;
    }
    case 'sling': {
      const s = c.slingRef;
      s.flash = 0.18;
      const kick = 620 / b.mass;
      const jx = s.nx * kick + (rnd() - 0.5) * 90;
      const jy = s.ny * kick + (rnd() - 0.5) * 60;
      b.vx += jx; b.vy += jy;
      award(250, s.cx, s.cy);
      sfx('sling'); shake(2.6);
      break;
    }
    case 'drop': {
      const d = T.drops[c.idx];
      if (d.down) break;
      d.down = true; d.col.live = false; d.flash = 0.4;
      award(1200, d.x, d.y, PAL.lime);
      sfx('drop');
      if (T.drops.every(x => x.down)) {
        award(18000, 132, 524, PAL.lime);
        say('BANK CLEARED', 'HATCH SEALED', 2);
        sfx('bankdone'); shake(5); G.flash = 0.15;
        p.prog.drops++;
        later(0.9, () => { T.drops.forEach(x => { x.down = false; x.col.live = true; }); });
        checkObjective();
      }
      break;
    }
    case 'grid': {
      const g = T.grid[c.idx];
      if (g.down) break;
      g.down = true; g.lit = false; g.col.live = false; g.flash = 0.4;
      award(2000 + (T.sockets[0].filled ? 3000 : 0), g.x, g.y, PAL.cyan);
      sfx('grid');
      if (G.superLit) superJackpot();
      if (G.mode2 && G.mode2.id === 'sonar') { G.mode2.got++; modeProgress(); }
      if (T.grid.every(x => x.down)) {
        award(30000, 222, 336, PAL.lime);
        p.prog.grid++;
        openGate();
        checkObjective();
      }
      break;
    }
    case 'kbtarget': {
      T.kbTarget.flash = 0.4;
      if (!T.kickback.charged) { T.kickback.charged = true; say('KICKBACK ARMED', '', 1.6); sfx('charge'); }
      award(1500, T.kbTarget.x, T.kbTarget.y);
      break;
    }
    case 'creature': hitCreature(c.ref, b, speed); break;
    case 'gate': if (speed > 300) { G.T.gate.flash = 0.2; sfx('metal', loud); } break;
    default:
      if (speed > 220) sfx(c.mat.snd, loud);
      break;
  }
  if (speed > 900) shake(clamp(speed / 700, 0, 5));
  b.glow = Math.max(b.glow, clamp(speed / 1600, 0, 1));
}

/* ================================================================= sensors */
function checkSensors(dt) {
  const T = G.T;
  for (const s of T.sensors) if (s.cd > 0) s.cd -= dt;
  for (const b of G.balls) {
    if (b.state !== 'free') { b.lastX = b.x; b.lastY = b.y; continue; }
    for (const s of T.sensors) {
      if (s.cd > 0) continue;
      let hit = false;
      if (s.k === 'cir') hit = dist2(b.x, b.y, s.x, s.y) < s.r * s.r;
      else hit = segCross(b.lastX, b.lastY, b.x, b.y, s.ax, s.ay, s.bx, s.by);
      if (!hit) continue;
      s.cd = s.cool;
      fireSensor(s, b);
      if (b.state !== 'free') break;
    }
    /* holes are checked directly */
    checkHoles(b);
    b.lastX = b.x; b.lastY = b.y;
  }
}
function fireSensor(s, b) {
  const T = G.T, p = P();
  if (s.tag === 'rollover') {
    const ro = T.rollovers[s.idx];
    ro.flash = 0.5;
    if (!ro.lit) { ro.lit = true; p.dive[s.idx] = true; sfx('rollover'); }
    else sfx('rolloverlit');
    award(1500, ro.x, ro.y);
    if (!b.launched) skillShot(s.idx, b);
    if (T.rollovers.every(r => r.lit)) {
      T.rollovers.forEach(r => { r.lit = false; r.flash = 0.8; });
      p.dive = [false, false, false, false];
      p.bonusX = Math.min(p.bonusX + 1, 10);
      say('D-I-V-E COMPLETE', 'BONUS X' + p.bonusX, 2.4);
      award(12000); sfx('divedone'); G.flash = 0.14;
      if (p.bonusX >= 4 && !p.gotExtra) { p.gotExtra = true; p.extraBalls++; say('EXTRA BALL', 'LIT', 2.5); sfx('extra'); }
    }
  } else if (s.tag === 'spinner') {
    const sp = Math.hypot(b.vx, b.vy);
    const n = clamp(Math.round(sp / 90), 1, 26);
    T.spinner.vel = Math.max(T.spinner.vel, sp * 0.05);
    T.spinner.count += n;
    p.prog.spins += n;
    award(280 * n, 31, 330, PAL.lime);
    if (G.mode2 && G.mode2.id === 'salvage') { G.mode2.got += n; modeProgress(); }
    sfx('spin');
    checkObjective();
  } else if (s.tag === 'ramp') {
    const v = Math.hypot(b.vx, b.vy);
    const dot = (b.vx * s.ref.dirx + b.vy * s.ref.diry) / (v || 1);
    if (v > s.ref.minV && dot > 0.45) enterRamp(b, s.ref);
  } else if (s.tag === 'orbit') {
    if (b.vy < -180) {
      p.prog.orbits++;
      award(6000, s.ax + 16, s.ay, PAL.cyan);
      say('ORBIT', s.side === 'L' ? 'PORT LOOP' : 'STARBOARD LOOP', 1.2);
      sfx('orbit');
      checkObjective();
    }
  } else if (s.tag === 'kickback') {
    if (T.kickback.charged && !G.tilt.dead) {
      T.kickback.charged = false; T.kickback.flash = 0.5;
      b.vy = -1380 / b.mass; b.vx = rndR(-40, 60);
      b.y = 866;
      say('KICKBACK', 'SAVED', 1.6); sfx('kickback'); shake(6);
      award(5000, 26, 860, PAL.lime);
    }
  }
}

/* --------------------------------------------------- captive holes (saucer,
   lock sockets) — these physically hold the ball. */
function checkHoles(b) {
  const T = G.T, p = P();
  /* saucer */
  const sa = T.saucer;
  if (sa.cool > 0) sa.cool -= 1 / 480;
  if (!sa.ball && sa.cool <= 0 && dist2(b.x, b.y, sa.x, sa.y) < sa.r * sa.r) {
    sa.ball = b; b.state = 'held'; b.hold = { k: 'saucer' };
    b.x = sa.x; b.y = sa.y; b.vx = b.vy = 0;
    sa.timer = 1.3; sa.flash = 0.6;
    sfx('saucer');
    award(9000, sa.x, sa.y, PAL.lilac);
    startMode();
    return;
  }
  /* lock sockets: only live once the gate is open */
  if (T.gate.state === 'open' || T.gate.state === 'opening') {
    for (const s of T.sockets) {
      if (s.filled) continue;
      if (dist2(b.x, b.y, s.x, s.y) < s.r * s.r) {
        s.filled = true; s.ball = b; b.state = 'held'; b.hold = { k: 'socket', ref: s };
        b.x = s.x; b.y = s.y; b.vx = b.vy = 0;
        s.flash = 1.0;
        p.locks++;
        award(25000, s.x, s.y, PAL.lime);
        sfx('lock'); shake(6); G.flash = 0.18;
        const other = T.sockets.find(o => o !== s);
        if (!other.filled) { other.lit = 2; say('BALL LOCKED', 'SECOND SOCKET HOT', 2.4); }
        else { say('BOTH LANTERNS LIT', '', 1.6); }
        if (T.sockets.every(o => o.filled)) later(1.2, startMultiball);
        return;
      }
    }
  }
}

/* ------------------------------------------------------------- skill shot */

/* -------------------------------------------------------------- saucer kick */
function updateHolds(dt) {
  const T = G.T;
  const sa = T.saucer;
  if (sa.ball) {
    sa.timer -= dt;
    if (sa.timer <= 0) {
      const b = sa.ball; sa.ball = null;
      b.state = 'free';
      const a = rad(sa.kickA);
      b.x = sa.x + Math.cos(a) * 26; b.y = sa.y + Math.sin(a) * 26;
      const sp = 620 / Math.sqrt(b.mass);
      b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
      sa.cool = 0.7;
      sfx('kickout'); shake(4);
    }
  }
